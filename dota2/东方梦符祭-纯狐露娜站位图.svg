<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685 445" width="685" height="445" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <!-- 头像圆章阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外层白底圆角边框（完全仿照百度贴吧原图外框） -->
  <rect x="2" y="2" width="681" height="441" rx="8" ry="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- 灰色怪物行进通道 + 右侧正方形刷怪池（原图1:1像素坐标还原） -->
  <path d="M 37,3 L 96,3 L 96,188 L 615,188 L 615,387 L 394,387 L 394,247 L 37,247 Z" fill="#a6a6a6"/>

  <!-- 光之三妖精红色虚线三角形（斯塔 - 露娜 - 桑尼） -->
  <g stroke="#d93829" stroke-width="1.6" stroke-dasharray="3.5,2.5" fill="none">
    <!-- 左竖线：斯塔(338,134) -> 露娜(338,316) -->
    <line x1="338" y1="152" x2="338" y2="298"/>
    <!-- 上斜线：斯塔(338,134) -> 桑尼(634,250) -->
    <line x1="355" y1="141" x2="616" y2="243"/>
    <!-- 下斜线：露娜(338,316) -> 桑尼(634,250) -->
    <line x1="356" y1="312" x2="616" y2="254"/>
  </g>

  <!-- ==================== 11个角色圆形站位图章（1:1原图圆心坐标） ==================== -->

  <!-- 1. 斯塔 (338, 134) - 三妖精上顶点 (R 蓝框) -->
  <g transform="translate(338, 134)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">斯塔</text>
    <text y="10" text-anchor="middle" fill="#7dd3fc" font-size="8.5">3★</text>
  </g>

  <!-- 2. 梅蒂欣 [上左] (252, 186) (R 蓝框) -->
  <g transform="translate(252, 186)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">梅蒂欣</text>
    <text y="10" text-anchor="middle" fill="#7dd3fc" font-size="8.5">3★</text>
  </g>

  <!-- 3. 梅蒂欣 [上右] (306, 186) (R 蓝框) -->
  <g transform="translate(306, 186)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">梅蒂欣</text>
    <text y="10" text-anchor="middle" fill="#7dd3fc" font-size="8.5">3★</text>
  </g>

  <!-- 4. 古明地觉 (397, 182) (R 蓝框) -->
  <g transform="translate(397, 182)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#831843" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">觉</text>
    <text y="10" text-anchor="middle" fill="#f9a8d4" font-size="8.5">1★</text>
  </g>

  <!-- 5. 八云紫 [下排最左] (196, 247) (SSR 金框) -->
  <g transform="translate(196, 247)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#4c1d95" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">紫妈</text>
    <text y="10" text-anchor="middle" fill="#fde68a" font-size="8.5">1★</text>
  </g>

  <!-- 6. 梅蒂欣 [下左] (252, 247) (R 蓝框) -->
  <g transform="translate(252, 247)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">梅蒂欣</text>
    <text y="10" text-anchor="middle" fill="#7dd3fc" font-size="8.5">3★</text>
  </g>

  <!-- 7. 梅蒂欣 [下右·带4伞] (309, 250) (R 蓝框) -->
  <g transform="translate(309, 250)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">梅蒂欣</text>
    <text y="10" text-anchor="middle" fill="#fde047" font-size="8">3★4伞</text>
  </g>

  <!-- 8. 赫卡提亚 [池子内拐角] (383, 254) (SSR 金框) -->
  <g transform="translate(383, 254)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#7f1d1d" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">赫卡</text>
    <text y="10" text-anchor="middle" fill="#fca5a5" font-size="8">1★红球</text>
  </g>

  <!-- 9. 桑尼 (634, 250) - 三妖精右顶点 (R 蓝框) -->
  <g transform="translate(634, 250)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">桑尼</text>
    <text y="10" text-anchor="middle" fill="#7dd3fc" font-size="8.5">3★</text>
  </g>

  <!-- 10. 露娜 (338, 316) - 三妖精下顶点·全队唯一5星主C -->
  <g transform="translate(338, 316)" filter="url(#shadow)">
    <circle r="20" fill="#1e293b" stroke="#dc2626" stroke-width="2.2"/>
    <circle r="17.5" fill="#b45309" stroke="#fde047" stroke-width="1.8"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">露娜</text>
    <text y="10" text-anchor="middle" fill="#fef08a" font-size="8.5" font-weight="bold">5★主C</text>
  </g>

  <!-- 11. 纯狐 [最底端左上] (255, 387) (SSR 金框) -->
  <g transform="translate(255, 387)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">纯狐</text>
    <text y="10" text-anchor="middle" fill="#fde68a" font-size="8">1★关AI</text>
  </g>

  <!-- 12. 十六夜咲夜 [最底端右下] (285, 408) (SR 紫框) -->
  <g transform="translate(285, 408)" filter="url(#shadow)">
    <circle r="19" fill="#1e293b" stroke="#8b261d" stroke-width="2"/>
    <circle r="16.5" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
    <text y="-2" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">十六夜</text>
    <text y="10" text-anchor="middle" fill="#e9d5ff" font-size="8.5">3★</text>
  </g>
</svg>
